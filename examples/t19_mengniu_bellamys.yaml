    gov_reason: "Intermediate holding company in the COFCO chain."
  - id: COFCO_DairyInvestments
    name: "COFCO Dairy Investments Limited"
    kind: corporation
    gov_status: none
    gov_reason: "Intermediate holding company in the COFCO chain."
  - id: COFCO_ProminentAchiever
    name: "Prominent Achiever Limited"
    kind: corporation
    gov_status: none
    gov_reason: "Intermediate holding company in the COFCO chain."
  - id: COFCO_WDF
    name: "WDF Investment Co., Ltd."
    kind: corporation
    gov_status: none
    gov_reason: "Intermediate holding company in the COFCO chain."
  - id: HK_Mengniu
    name: "China Mengniu Dairy Company Limited (2319.HK)"
    kind: corporation
    country: KY
    gov_status: none
    gov_reason: "Listed company incorporated in the Cayman Islands; not itself a government body."
    note: "Other substantial shareholders in the 2025 report: Arla Foods amba (deemed, through arrangements with COFCO entities), BlackRock 6.94%, Brown Brothers Harriman 5.01%. Not entered: none is a foreign government holding."
  - id: AU_Bellamys
    name: "Bellamy's Australia Limited"
    kind: corporation
    country: AU
    gov_status: none

