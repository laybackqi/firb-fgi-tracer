# T19 (real structure): China Mengniu Dairy and an acquisition of Bellamy's Australia.
#
# Upstream figures: China Mengniu Dairy Company Limited, Annual Report 2025,
# "Substantial shareholders" table and footnotes, as at 31 December 2025
# (issued shares 3,878,902,513). Percentages below are each holder's direct
# shares divided by that total. The transaction: Mengniu's 2019 scheme to
# acquire 100% of Bellamy's Australia Ltd (Treasurer's media release; Allens).
# This file applies the CURRENT law and the 2025 shareholding to that deal:
# an illustration of the method, not an account of the 2019 approval.
#
# What it teaches (rule R18): no COFCO company holds 20% of Mengniu in its
# own name. The largest, COFCO Dairy Investments, holds 14.18% (550,146,260
# shares, footnote 7). The report's table shows it at 24.20%, but that is a
# Hong Kong "deemed interest": it adds subsidiaries' shares and shares under a
# concert agreement (SFO s 317), so the table's rows overlap. Arla Foods also
# shows 24.20% for the same reason, without owning any of these shares.
# Tracing the chain under FATA gives 24.52%, matching COFCO Corporation's row.
# Entering one figure without the chain (24%, 16.2%, 14.18%) gives a
# different or unsupported answer.
#
# Cross-checked with the 2024 annual report (as at 31 December 2024):
# COFCO Corporation 950,014,304 shares, 24.24%; same chain (70%, 82.16%).
#
# Entity ids: PLACE_ROLE / GROUP_ROLE. Terms and proper nouns in capitals.

title: "T19 · COFCO-controlled Mengniu acquires 100% of Bellamy's Australia"
buyer: HK_Mengniu
target: AU_Bellamys

transaction:
  action: acquire_interest
  target_is_australian: true
  target_is_mining_entity: false

