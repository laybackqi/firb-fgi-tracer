    name: "COFCO Corporation (中粮集团有限公司)"
    kind: corporation
    country: CN
    gov_status: SGE
    gov_reason: "FATA s 4 'separate government entity': central state-owned enterprise in which the PRC central government holds a controlling interest. User's characterisation (R1)."
  - id: COFCO_HK
    name: "COFCO (Hong Kong) Limited"
    kind: corporation
    country: HK
    gov_status: none
    gov_reason: "Not itself a government body; held by COFCO Corporation."
  - id: COFCO_ChinaFoods-Holdings
    name: "China Foods (Holdings) Limited"
    kind: corporation
    gov_status: none
    gov_reason: "Intermediate holding company in the COFCO chain."
  - id: COFCO_Farwill
    name: "Farwill Limited"
    kind: corporation
    gov_status: none
    gov_reason: "Intermediate holding company in the COFCO chain."
  - id: COFCO_DairyHoldings
