# T18 (real fund, hypothetical target): the Yangtze River Delta venture
# capital guidance fund, a limited partnership under the National Venture
# Capital Guidance Fund.
#
# Public facts (business-registration reports, December 2025 to February 2026):
# - 长三角创业投资引导基金合伙企业（有限合伙）, registered in Shanghai Pudong on
#   22 December 2025 with capital of RMB 47.1bn, increased to RMB 55.1bn.
# - Its general partner is 国投创合长三角（上海）创业投资管理有限公司, whose
#   shareholders include SDIC, Shanghai SDIC, Pudong Capital, Suzhou Guofa and
#   Conch Group: all state-owned.
# - Its partners are the National Venture Capital Guidance Fund, SDIC, Anhui,
#   Zhejiang (Hangzhou, Ningbo), Shanghai and Suzhou state platforms, Conch Group,
#   and, from February 2026, ICBC Financial Asset Investment (RMB 3bn), the Jiangsu
#   strategic emerging industries mother fund (RMB 3bn), the Zhejiang venture
#   guidance fund and Nanjing Zixin. Shanghai SDIC's asset manager put in RMB 0.5bn.
#
# Only three contributions are public (RMB 3bn, 3bn, 0.5bn of 55.1bn). The rest
# (RMB 48.6bn, 88.20%) is entered as one row: every partner named in the reports
# is a central or local state-owned entity or government fund, but the split
# between them is not in free public sources. The result does not depend on the
# split, because state entities of one country are associates (R6).
#
# A limited partnership is entered as its general partner, with each partner's
# share of distributions held in it (as in T13). The Australian target is
# hypothetical.
#
# Entity ids: PLACE_ROLE. Terms and proper nouns in capitals.

