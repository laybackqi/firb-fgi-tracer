[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firb-fgi-tracer"
version = "0.0.1"
description = "Screening tool: is an acquirer a foreign government investor under Australia's FATA?"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
